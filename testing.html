<!doctype html>
<html>
  <head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1, user-scalable=no'>
    <title>AR Test - No Model</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://esm.sh/three@0.158.0",
          "three/addons/": "https://esm.sh/three@0.158.0/examples/jsm/"
        }
      }
    </script>
    <style>
      body { margin: 0; }
      canvas { display: block; }
      #info {
        position: absolute;
        top: 10px;
        width: 100%;
        text-align: center;
        color: white;
        background: rgba(0,0,0,0.5);
        padding: 10px;
      }
      button { padding: 12px 24px; font-size: 16px; }
    </style>
  </head>
  <body>
    <div id="info">
      <button id="ar-button">START AR</button>
      <div id="status">Ready</div>
    </div>
    
    <script type="module">
      import * as THREE from 'three';
      
      let camera, scene, renderer;
      const arButton = document.getElementById('ar-button');
      const status = document.getElementById('status');
      
      init();
      
      function init() {
        status.textContent = 'Initializing...';
        
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
        
        // Add a simple test cube instead of loading a model
        const geometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        const cube = new THREE.Mesh(geometry, material);
        cube.position.set(0, 0, -2);
        scene.add(cube);
        
        // Lighting
        const light = new THREE.AmbientLight(0xffffff, 2.0);
        scene.add(light);
        
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        status.textContent = 'Checking AR support...';
        
        if ('xr' in navigator) {
          navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
            if (supported) {
              arButton.disabled = false;
              status.textContent = 'AR Ready - Click START AR';
            } else {
              arButton.disabled = true;
              status.textContent = 'AR not supported';
            }
          }).catch(err => {
            status.textContent = 'Error: ' + err.message;
          });
        } else {
          arButton.disabled = true;
          status.textContent = 'WebXR not available';
        }
        
        arButton.addEventListener('click', onARButtonClick);
        window.addEventListener('resize', onWindowResize);
        renderer.setAnimationLoop(render);
      }
      
      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
      
      function onARButtonClick() {
        if (renderer.xr.isPresenting) {
          renderer.xr.getSession().end();
        } else {
          status.textContent = 'Starting AR...';
          navigator.xr.requestSession('immersive-ar', {
            optionalFeatures: ['dom-overlay'],
            domOverlay: { root: document.body }
          }).then(onSessionStarted).catch(err => {
            status.textContent = 'AR Error: ' + err.message;
          });
        }
      }
      
      function onSessionStarted(session) {
        session.addEventListener('end', onSessionEnded);
        renderer.xr.setSession(session);
        arButton.textContent = 'EXIT AR';
        status.textContent = 'AR Active';
      }
      
      function onSessionEnded() {
        arButton.textContent = 'START AR';
        status.textContent = 'AR Ended';
      }
      
      function render() {
        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
