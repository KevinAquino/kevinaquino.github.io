<!doctype html>
<html>
  <head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1, user-scalable=no'>
    <meta name='mobile-web-app-capable' content='yes'>
    <meta name='apple-mobile-web-app-capable' content='yes'>
    <title>Immersive AR Session - THREE.js</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
      }
      canvas {
        display: block;
      }
      #info {
        position: absolute;
        top: 10px;
        width: 100%;
        text-align: center;
        color: white;
        background: rgba(0,0,0,0.5);
        padding: 10px;
      }
      button {
        padding: 12px 24px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="info">
      <button id="ar-button">START AR</button>
    </div>
    
    <script type="module">
      import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';
      import { GLTFLoader } from 'https://unpkg.com/three@0.158.0/examples/jsm/loaders/GLTFLoader.js';
      
      let camera, scene, renderer;
      let controller;
      let model;
      let xrRefSpace;
      
      const arButton = document.getElementById('ar-button');
      
      init();
      
      function init() {
        // Create container
        const container = document.createElement('div');
        document.body.appendChild(container);
        
        // Create scene
        scene = new THREE.Scene();
        
        // Create camera
        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
        
        // Add bright ambient light
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
        scene.add(ambientLight);
        
        // Add directional light for better definition
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
        directionalLight.position.set(1, 2, 1);
        scene.add(directionalLight);
        
        // Load GLB model
        const loader = new GLTFLoader();
        loader.load(
          './updated_reno.glb',
          function (gltf) {
            model = gltf.scene;
            model.position.set(0, -1.5, -2);
            model.scale.set(1, 1, 1);
            scene.add(model);
            console.log('Model loaded successfully with textures');
          },
          function (xhr) {
            console.log((xhr.loaded / xhr.total * 100) + '% loaded');
          },
          function (error) {
            console.error('Error loading model:', error);
          }
        );
        
        // Create renderer
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        container.appendChild(renderer.domElement);
        
        // Handle window resize
        window.addEventListener('resize', onWindowResize);
        
        // Setup AR button
        arButton.addEventListener('click', onARButtonClick);
        
        // Check AR support
        if ('xr' in navigator) {
          navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
            if (supported) {
              arButton.textContent = 'START AR';
              arButton.disabled = false;
            } else {
              arButton.textContent = 'AR NOT SUPPORTED';
              arButton.disabled = true;
            }
          });
        } else {
          arButton.textContent = 'WebXR NOT AVAILABLE';
          arButton.disabled = true;
        }
        
        // Start render loop
        renderer.setAnimationLoop(render);
      }
      
      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
      
      function onARButtonClick() {
        if (renderer.xr.isPresenting) {
          renderer.xr.getSession().end();
        } else {
          navigator.xr.requestSession('immersive-ar', {
            optionalFeatures: ['dom-overlay'],
            domOverlay: { root: document.body }
          }).then(onSessionStarted);
        }
      }
      
      function onSessionStarted(session) {
        session.addEventListener('end', onSessionEnded);
        
        renderer.xr.setSession(session);
        arButton.textContent = 'EXIT AR';
        
        session.requestReferenceSpace('local').then((refSpace) => {
          xrRefSpace = refSpace;
        });
      }
      
      function onSessionEnded() {
        arButton.textContent = 'START AR';
      }
      
      function render(timestamp, frame) {
        if (frame) {
          // In AR mode
          renderer.render(scene, camera);
        } else {
          // In inline mode (before AR starts)
          renderer.render(scene, camera);
        }
      }
    </script>
  </body>
</html>
